[workspace]
resolver = "3"
members = [
  "crates/*",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"

[profile.release]
# Reduce distribution size while retaining optimization for runtime performance.
strip = true
lto = "thin"
codegen-units = 1
opt-level = 3

[workspace.lints.rust]
unused = "allow"
non_upper_case_globals = "allow"

[workspace.lints.clippy]
erasing_op = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"
identity_op = "allow"
explicit_counter_loop = "allow"
precedence = "allow"
misrefactored_assign_op = "allow"
eq_op = "allow"
manual_memcpy = "allow"
double_parens = "allow"
unnecessary_cast = "allow"
manual_range_contains = "allow"
manual_div_ceil = "allow"
while_let_loop = "allow"
collapsible_if = "allow"
ptr_arg = "allow"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
bytemuck = { version = "1", features = ["derive"] }
wgpu = { version = "0.20", features = ["wgsl"] }
winit = "0.30"
pollster = "0.3"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "bmp", "dds"] }
log = "0.4"
env_logger = "0.11"
kira = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Resource rebuilding, MDL detection, and EXE key recovery process the full
# game pack during startup. Keep those crates optimized in Debug app builds so
# a first launch without key.toml does not stall the host startup thread.
[profile.dev.package.siglus_key_recovery]
opt-level = 3

[profile.dev.package.siglus_assets]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3
